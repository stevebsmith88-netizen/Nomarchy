# Runs on every push and pull request: the unit tests, a production build,
# and the database file applied twice to a fresh Postgres. A red cross on
# GitHub means something here broke - nothing is deployed differently.
name: CI

on:
  push:
  pull_request:

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder

  database:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - run: tests/schema/run.sh
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres

  # Signs in with a fake account (no real database) and clicks through every
  # tab and the main pop-ups in a real browser.
  smoke-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder
      - run: |
          npx next start -p 3150 &
          for i in $(seq 1 30); do curl -sf http://localhost:3150 > /dev/null && break; sleep 2; done
          npm run test:e2e -- http://localhost:3150
